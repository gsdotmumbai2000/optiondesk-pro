schema_version: 1
console:
  enabled: false
  level: INFO
  colorize: true
file:
  enabled: false
  level: DEBUG
  path: application.log
  rotation: 10 MB
  retention: 30 days
  compression: zip
daily:
  enabled: false
  level: INFO
  path: daily/{time:YYYY-MM-DD}.log
  retention: 180 days
error:
  enabled: false
  level: ERROR
  path: error.log
  rotation: 5 MB
  retention: 365 days
performance:
  enabled: false
  level: INFO
  path: performance.log
  rotation: 10 MB
audit:
  enabled: false
  level: INFO
  path: audit.log
  rotation: 10 MB
  retention: 2555 days
api:
  enabled: false
  level: DEBUG
  path: api.log
  rotation: 10 MB
  retention: 90 days
